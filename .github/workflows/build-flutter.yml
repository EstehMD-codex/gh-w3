name: Build Flutter / Web2APK

on:
  workflow_dispatch:
    inputs:
      jobId:
        description: 'ID build dari bot'
        required: true
        type: string
      userId:
        description: 'ID user dari bot'
        required: false
        default: '0'
        type: string
      payload:
        description: 'Payload JSON dari bot'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: build-${{ inputs.jobId }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ inputs.jobId }}
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Worker Repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Parse Bot Payload
        id: config
        shell: bash
        env:
          RAW_PAYLOAD: ${{ inputs.payload }}
        run: |
          set -euo pipefail
          PAYLOAD_FILE="$RUNNER_TEMP/build-payload.json"
          printf '%s' "$RAW_PAYLOAD" > "$PAYLOAD_FILE"

          if ! jq -e 'type == "object"' "$PAYLOAD_FILE" >/dev/null 2>&1; then
            echo "::error::Payload bukan JSON object yang valid."
            exit 1
          fi

          MODE="$(jq -r '.mode // "zip"' "$PAYLOAD_FILE")"
          BUILD_TYPE="$(jq -r '.buildType // "release"' "$PAYLOAD_FILE")"
          SOURCE_PATH="$(jq -r '.sourcePath // empty' "$PAYLOAD_FILE")"
          SOURCE_URL="$(jq -r '.url // empty' "$PAYLOAD_FILE")"
          APP_NAME="$(jq -r '.appName // "Web App"' "$PAYLOAD_FILE")"

          if [[ "$BUILD_TYPE" != "release" && "$BUILD_TYPE" != "debug" ]]; then
            echo "::error::buildType harus release atau debug."
            exit 1
          fi
          if [[ "$MODE" != "zip" && "$MODE" != "url" ]]; then
            echo "::error::Mode tidak dikenal: $MODE"
            exit 1
          fi

          if [[ "$MODE" == "zip" ]]; then
            if [[ -z "$SOURCE_PATH" || "$SOURCE_PATH" == /* || "$SOURCE_PATH" == *".."* ]]; then
              echo "::error::sourcePath ZIP kosong atau tidak aman."
              exit 1
            fi
            if [[ ! -f "$GITHUB_WORKSPACE/$SOURCE_PATH" ]]; then
              echo "::error::ZIP base tidak ditemukan: $SOURCE_PATH"
              find "$GITHUB_WORKSPACE" -maxdepth 1 -type f -name '*.zip' -printf '%f\n'
              exit 1
            fi
          elif [[ -z "$SOURCE_URL" ]]; then
            echo "::error::URL website Web2APK kosong."
            exit 1
          fi

          {
            echo "MODE=$MODE"
            echo "BUILD_TYPE=$BUILD_TYPE"
            echo "SOURCE_PATH=$SOURCE_PATH"
            echo "SOURCE_URL=$SOURCE_URL"
            echo "APP_NAME=$APP_NAME"
          } >> "$GITHUB_ENV"
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"

      - name: Extract and Locate Flutter Project
        if: steps.config.outputs.mode == 'zip'
        id: flutter-project
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/source"
          unzip -tq "$GITHUB_WORKSPACE/$SOURCE_PATH"
          unzip -q "$GITHUB_WORKSPACE/$SOURCE_PATH" -d "$RUNNER_TEMP/source"

          PUBSPEC="$(find "$RUNNER_TEMP/source" -type f -name pubspec.yaml \
            -not -path '*/.dart_tool/*' -print -quit)"
          if [[ -z "$PUBSPEC" ]]; then
            echo "::error::pubspec.yaml tidak ditemukan dalam ZIP base."
            find "$RUNNER_TEMP/source" -maxdepth 4 -type f | head -100
            exit 1
          fi
          echo "project_dir=$(dirname "$PUBSPEC")" >> "$GITHUB_OUTPUT"

      - name: Setup Flutter Stable
        if: steps.config.outputs.mode == 'zip'
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter Doctor
        if: steps.config.outputs.mode == 'zip'
        run: flutter doctor -v

      - name: Get Flutter Dependencies
        if: steps.config.outputs.mode == 'zip'
        working-directory: ${{ steps.flutter-project.outputs.project_dir }}
        run: flutter pub get

      - name: Build Flutter APK
        if: steps.config.outputs.mode == 'zip'
        working-directory: ${{ steps.flutter-project.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail
          flutter build apk --"$BUILD_TYPE"
          APK_PATH="build/app/outputs/flutter-apk/app-${BUILD_TYPE}.apk"
          if [[ ! -s "$APK_PATH" ]]; then
            echo "::error::APK Flutter tidak ditemukan."
            find build/app/outputs -type f 2>/dev/null | head -100
            exit 1
          fi
          echo "APK_PATH=$PWD/$APK_PATH" >> "$GITHUB_ENV"

      - name: Generate Web2APK Android Project
        if: steps.config.outputs.mode == 'url'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/web2apk/app/src/main/java/com/generated/webapk"
          mkdir -p "$RUNNER_TEMP/web2apk/app/src/main/res/values"

          cat > "$RUNNER_TEMP/web2apk/settings.gradle" <<'EOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "Web2APK"
          include(":app")
          EOF

          cat > "$RUNNER_TEMP/web2apk/build.gradle" <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          cat > "$RUNNER_TEMP/web2apk/gradle.properties" <<'EOF'
          android.useAndroidX=true
          org.gradle.jvmargs=-Xmx3g
          EOF

          cat > "$RUNNER_TEMP/web2apk/app/build.gradle" <<'EOF'
          plugins { id 'com.android.application' }
          android {
              namespace 'com.generated.webapk'
              compileSdk 35
              defaultConfig {
                  applicationId 'com.generated.webapk'
                  minSdk 23
                  targetSdk 35
                  versionCode 1
                  versionName '1.0'
              }
              buildTypes {
                  release { minifyEnabled false }
                  debug { debuggable true }
              }
          }
          EOF

          python3 - <<'PY'
          import os
          import xml.etree.ElementTree as ET
          root = ET.Element("resources")
          ET.SubElement(root, "string", {"name": "app_name"}).text = os.environ["APP_NAME"]
          ET.SubElement(root, "string", {"name": "start_url"}).text = os.environ["SOURCE_URL"]
          ET.indent(root)
          ET.ElementTree(root).write(
              os.path.join(os.environ["RUNNER_TEMP"], "web2apk/app/src/main/res/values/strings.xml"),
              encoding="utf-8", xml_declaration=True
          )
          PY

          cat > "$RUNNER_TEMP/web2apk/app/src/main/AndroidManifest.xml" <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET"/>
              <application android:label="@string/app_name"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > "$RUNNER_TEMP/web2apk/app/src/main/java/com/generated/webapk/MainActivity.java" <<'EOF'
          package com.generated.webapk;
          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          public class MainActivity extends Activity {
              private WebView webView;
              @Override public void onCreate(Bundle state) {
                  super.onCreate(state);
                  webView = new WebView(this);
                  setContentView(webView);
                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  webView.setWebViewClient(new WebViewClient());
                  webView.setWebChromeClient(new WebChromeClient());
                  webView.loadUrl(getString(R.string.start_url));
              }
              @Override public void onBackPressed() {
                  if (webView.canGoBack()) webView.goBack();
                  else super.onBackPressed();
              }
          }
          EOF

      - name: Setup Android SDK
        if: steps.config.outputs.mode == 'url'
        uses: android-actions/setup-android@v3

      - name: Build Web2APK
        if: steps.config.outputs.mode == 'url'
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
          cd "$RUNNER_TEMP/web2apk"
          curl --fail --location \
            https://services.gradle.org/distributions/gradle-8.9-bin.zip \
            --output "$RUNNER_TEMP/gradle.zip"
          unzip -q "$RUNNER_TEMP/gradle.zip" -d "$RUNNER_TEMP"
          if [[ "$BUILD_TYPE" == "release" ]]; then TASK="assembleRelease"; else TASK="assembleDebug"; fi
          "$RUNNER_TEMP/gradle-8.9/bin/gradle" --no-daemon ":app:$TASK"
          APK_PATH="$RUNNER_TEMP/web2apk/app/build/outputs/apk/${BUILD_TYPE}/app-${BUILD_TYPE}.apk"
          if [[ ! -s "$APK_PATH" ]]; then
            echo "::error::APK Web2APK tidak ditemukan."
            exit 1
          fi
          echo "APK_PATH=$APK_PATH" >> "$GITHUB_ENV"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ inputs.jobId }}
          path: ${{ env.APK_PATH }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
          
