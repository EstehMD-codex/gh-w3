name: Flutter Queue Worker

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: flutter-queue-worker
  cancel-in-progress: false

jobs:
  worker:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - name: Checkout worker repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Wait for jobs and build APKs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          BRANCH="${GITHUB_REF_NAME}"
          DEADLINE=$(( $(date +%s) + 18900 ))
          mkdir -p queue results
          echo "Queue worker online; waiting for queue/*.json"

          commit_changes() {
            git add queue results
            if ! git diff --cached --quiet; then
              git commit -m "$1"
              git push origin "HEAD:${BRANCH}"
            fi
          }

          while [ "$(date +%s)" -lt "$DEADLINE" ]; do
            git fetch origin "$BRANCH"
            git reset --hard "origin/${BRANCH}"
            mkdir -p queue results

            ITEM="$(find queue -maxdepth 1 -type f -name '*.json' -print | sort | head -n 1)"
            if [ -z "$ITEM" ]; then
              sleep 15
              continue
            fi

            JOB_ID="$(jq -r '.jobId // empty' "$ITEM")"
            SOURCE="$(jq -r '.sourcePath // empty' "$ITEM")"
            MODE="$(jq -r '.buildType // "release"' "$ITEM")"
            SAFE_ID="$(printf '%s' "$JOB_ID" | tr -cd 'A-Za-z0-9._-')"
            if [ -z "$SAFE_ID" ] || [ -z "$SOURCE" ] || [ ! -f "$SOURCE" ]; then
              echo "Invalid queue entry: $ITEM"
              touch "results/${SAFE_ID:-invalid}.failed"
              rm -f "$ITEM"
              commit_changes "Reject invalid Flutter queue entry"
              continue
            fi

            echo "Building ${SAFE_ID} (${MODE}) from ${SOURCE}"
            JOB_DIR="${RUNNER_TEMP}/flutter-${SAFE_ID}"
            mkdir -p "$JOB_DIR"
            if ! unzip -q "$SOURCE" -d "$JOB_DIR"; then
              touch "results/${SAFE_ID}.failed"
              rm -f "$ITEM"
              commit_changes "Mark invalid ZIP ${SAFE_ID}"
              rm -rf "$JOB_DIR"
              continue
            fi

            PROJECT="$(find "$JOB_DIR" -name pubspec.yaml -type f -printf '%h\n' | head -n 1)"
            BUILD_OK=0
            if [ -n "$PROJECT" ]; then
              pushd "$PROJECT" >/dev/null
              flutter pub get
              if [ "$MODE" = "debug" ]; then
                flutter build apk --debug && BUILD_OK=1
              else
                flutter build apk --release && BUILD_OK=1
              fi
              popd >/dev/null
            else
              echo "pubspec.yaml not found in ZIP"
            fi

            if [ "$BUILD_OK" -eq 1 ]; then
              RESULT_DIR="${RUNNER_TEMP}/result-${SAFE_ID}"
              mkdir -p "$RESULT_DIR"
              find "$PROJECT/build/app/outputs/flutter-apk" -maxdepth 1 -type f -name '*.apk' -exec cp {} "$RESULT_DIR/" \;
              if find "$RESULT_DIR" -type f -name '*.apk' | grep -q .; then
                (cd "$RESULT_DIR" && zip -q "${GITHUB_WORKSPACE}/results/${SAFE_ID}.zip" .)
              else
                touch "results/${SAFE_ID}.failed"
              fi
            else
              touch "results/${SAFE_ID}.failed"
            fi

            rm -f "$ITEM"
            commit_changes "Complete Flutter build ${SAFE_ID}"
            rm -rf "$JOB_DIR" "${RUNNER_TEMP}/result-${SAFE_ID}"
            echo "Finished ${SAFE_ID}; worker returns to queue polling"
          done

          echo "Worker session time limit reached. Restart this workflow manually for the next queue session."
          
